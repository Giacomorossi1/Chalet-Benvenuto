}

.logo.xl{width:180px;height:180px;margin:0 auto 14px}
#esSel:empty{display:none}
#esSel{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs a{flex:1;max-width:170px;text-align:center;padding:10px 4px 9px;color:var(--muted);text-decoration:none;font-size:.76rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}

section.view{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--wood);font-weight:600}
.big{font-family:var(--display);font-size:2.1rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.mid{font-family:var(--display);font-size:1.4rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.85rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.floor{border-top:4px solid var(--c)}
.floor.PT{--c:var(--pt)} .floor.PB{--c:var(--pb)} .floor.Comune{--c:var(--muted)}
.floor .label{color:var(--c)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:600;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--wood)}
.btn.primary{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.btn.big2{padding:15px;font-size:1rem}
.btn.danger{border-color:color-mix(in srgb,var(--out) 40%,var(--line));color:var(--out)}
.btn.small{padding:7px 10px;font-size:.82rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* elenchi */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .d{font-size:.76rem;color:var(--muted);width:44px;text-align:center;line-height:1.15}
.row .d b{display:block;font-size:1.05rem;color:var(--ink);font-family:var(--display)}
.row .t{min-width:0}
.row .t .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .t .m{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.row .a{font-weight:600;text-align:right;white-space:nowrap}
.row .a small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.a.in{color:var(--in)} .a.out{color:var(--out)}
.chip{display:inline-block;font-size:.7rem;font-weight:700;border-radius:5px;padding:1px 6px;letter-spacing:.03em}
.chip.PT{background:color-mix(in srgb,var(--pt) 16%,transparent);color:var(--pt)}
.chip.PB{background:color-mix(in srgb,var(--pb) 18%,transparent);color:var(--pb)}
.chip.Comune{background:var(--surface2);color:var(--muted)}
.pill{font-size:.7rem;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--out)}
.monthhead{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 2px 4px}
.empty{text-align:center;color:var(--muted);padding:24px 12px}
.banner{border-radius:10px;padding:10px 12px;background:var(--warn-bg);color:var(--ink);font-size:.88rem}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:8px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,#000 15%,transparent)}

/* calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhead h2{font-size:1.1rem;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .dow{font-size:.68rem;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding-bottom:4px}
.cal .day{min-height:62px;background:color-mix(in srgb,var(--surface2) 75%,var(--surface));border-radius:6px;padding:3px 0 4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.blank{background:none}
.cal .day .dn{font-size:.72rem;font-weight:600;color:var(--muted);padding-left:5px}
.cal .day.today .dn{color:var(--accent);font-weight:800}
.rp{background:var(--surface2);border-radius:12px;padding:10px;margin-bottom:12px;touch-action:pan-y}
.rp .rphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.rp .rphead b{text-transform:capitalize}
.rp .rpsel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.rp .rpsel div{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.8rem;color:var(--muted)}
.rp .rpsel div b{display:block;color:var(--ink);font-size:.98rem}
.rp .rpsel div.on{border-color:var(--accent)}
.rpg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.rpg .dow{font-size:.66rem;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding-bottom:2px}
.rpg button{border:0;background:var(--surface);border-radius:8px;min-height:40px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);padding:0}
.rpg button.busy{background:repeating-linear-gradient(135deg,var(--surface) 0 5px,color-mix(in srgb,var(--out) 22%,var(--surface)) 5px 9px);color:var(--muted)}
.rpg button.in{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.rpg button.sel{background:var(--accent);color:var(--surface)}
.rpg button.td{outline:2px solid var(--wood);outline-offset:-2px}

<body>
<div class="wrap">
  <header class="top">
    <div class="logo" role="img" aria-label="Chalet Benvenuto"></div>
    <h1><small>Chalet Benvenuto</small><span id="viewTitle">Affitti</span></h1>
    <select id="esSel" aria-label="Esercizio"></select>
  </header>

  <div id="status" class="empty"><div class="logo xl" aria-hidden="true"></div>Sto aprendo l'archivio dello chalet…</div>

  <section class="view" id="v-affitti" hidden></section>
  <section class="view" id="v-costi" hidden></section>
  <section class="view" id="v-cassa" hidden></section>
  <section class="view" id="v-impostazioni" hidden></section>
</div>

<nav class="tabs" aria-label="Sezioni">
  <a href="#affitti" data-v="affitti"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Affitti</a>
  <a href="#costi" data-v="costi"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Costi</a>
  <a href="#cassa" data-v="cassa"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14.5" r="1.5"/></svg>Cassa</a>
  <a href="#impostazioni" data-v="impostazioni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Impostazioni</a>
</nav>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
const EUR0 = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const eur = n => EUR.format(Math.round((+n||0)*100)/100);
const eur0 = n => EUR0.format(+n||0);
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESI_L = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const fmtD = s => s ? `${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}` : '—';
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => iso(new Date());
const addDays = (s,n) => { const d=new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)+n); return iso(d); };
const cap = s => s ? s.charAt(0)+s.slice(1).toLowerCase() : '';
const r2 = n => Math.round(n*100)/100;
const CANALI = ['Cash','Booking','Airbnb','Uso privato'];
const canL = c => c==='Cash' ? 'Diretto' : c;   // 'Cash' = accordo diretto con l'ospite, senza intermediari
const DEF_CAT = ['BOMBOLE GAS','GASOLIO CALDAIA','LENZUOLA E ASCIUGAMANI','PERSONALE','UTENZE ACQUA','UTENZE LUCE','VARIE','VIAGGI'];
const PIANO_L = {PT:'Piano Terra', PB:'Piano Balconi', Comune:'Comune'};
const VIEW_T = {affitti:'Affitti', costi:'Costi', cassa:'Cassa e utili', impostazioni:'Impostazioni'};

const S = { db:null, userId:null, movs:[], eser:{}, cats:DEF_CAT.slice(), cur:null, view:'affitti',
  calM:null, costPiano:'Comune', got:{m:false,e:false}, failed:false };

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ---------- regole di calcolo (stesse del file Excel v2) ---------- */
function fineEs(e){ return addDays(`${+e.inizio.slice(0,4)+1}${e.inizio.slice(4)}`,-1); }
function esId(inizio){ const y=+inizio.slice(0,4); return `${y}-${String(y+1).slice(2)}`; }
function notti(m){ if(!m.data||!m.dataFine) return 0; return Math.max(0,Math.round((new Date(m.dataFine)-new Date(m.data))/864e5)); }
const incassato = m => m.tipo!=='Entrata' ? 0 : (m.saldato ? (+m.importo||0) : Math.min(+m.importo||0, +m.caparra||0));
const residuo = m => m.tipo!=='Entrata' ? 0 : r2((+m.importo||0) - incassato(m));
const extra = m => (+m.pulizie||0)+(+m.lenzuola||0);
const daOspite = m => residuo(m)>0 ? r2(residuo(m)+extra(m)) : 0;   // quanto l'ospite deve ancora versare, pulizie e lenzuola comprese
const totale = m => r2((+m.importo||0)+extra(m));   // prezzo totale pagato dall'ospite
const perNotte = m => { const n=notti(m); return n && totale(m) ? totale(m)/n : 0; };
function warnText(m,e){
  if(!m.data) return 'data mancante';
  if(e && (m.data<e.inizio || m.data>fineEs(e))) return 'fuori esercizio: anno giusto?';
  if(m.tipo==='Entrata' && !m.canale) return 'manca canale';
  if(m.importo===null||m.importo===undefined||m.importo==='') return 'manca importo';
  if(!m.piano) return 'manca piano';
  return '';
}
const sum = (a,f=()=>true) => a.filter(f).reduce((s,m)=>s+(+m.importo||0),0);

function anticipi(e){ const g=+e.provvGiacomo||0; const p = (e.provvPapa===undefined||e.provvPapa===null) ? (+e.provvPagate||0) - g : +e.provvPapa||0; return {g, p, tot:g+p}; }
function calc(e){
  const M = S.movs.filter(m=>m.esercizio===e.id);
  const ent = M.filter(m=>m.tipo==='Entrata'), usc = M.filter(m=>m.tipo==='Uscita' && m.categoria!=='PULIZIE'), prel = M.filter(m=>m.tipo==='Prelievo'), dep = M.filter(m=>m.tipo==='Deposito');
  const fut = S.movs.filter(m=>m.tipo==='Entrata' && m.esercizio > e.id && !S.eser[m.esercizio]);
  const r = {M,ent,usc,prel,dep,fut};
  /* soldi sul conto che non sono di quest'anno: affitti già pagati per gli esercizi futuri e caparre da restituire */
  r.antic = r2(fut.reduce((s,m)=>s+incassato(m)+(m.saldato?extra(m):0),0));
  r.depDaRest = sum(dep,m=>!m.saldato);
  r.terzi = r2(r.antic + r.depDaRest);
  /* pulizie: 70 € a piano dentro il prezzo totale; l'app le segue per i soggiorni che finiscono dopo e.pulizieDal */
  const pulDal = e.pulizieDal || e.inizio, oggi = today();
  r.pulDal = pulDal;
  r.pulPagL = M.filter(m=>m.tipo==='Uscita' && m.categoria==='PULIZIE');
  r.pulSogg = ent.filter(m=>m.dataFine && m.dataFine>pulDal && +m.pulizie>0);
  r.pulFatte = r.pulSogg.filter(m=>m.dataFine<=oggi);
  r.pulProx = r.pulSogg.filter(m=>m.dataFine>oggi);
  const nInt = L => L.reduce((s,m)=>s+(m.piano==='Comune'?2:1),0);
  r.pulInterv = nInt(r.pulFatte); r.pulIntervProx = nInt(r.pulProx);
  r.pulMat = r2(r.pulFatte.reduce((s,m)=>s+(+m.pulizie||0),0));
  r.pulProxTot = r2(r.pulProx.reduce((s,m)=>s+(+m.pulizie||0),0));
  r.pulPag = sum(r.pulPagL);
  r.pulDaPag = r2(r.pulMat - r.pulPag);
  const isPriv = m => m.canale==='Uso privato';
  r.pulInc = r2(r.pulSogg.filter(m=>!isPriv(m)).reduce((s,m)=>s+(m.saldato?extra(m):0),0));   // pagate dagli ospiti
  /* uso privato con pulizie: nessuno le paga, sono una spesa del piano (o comune se tutta la casa) */
  const priv = r.pulSogg.filter(isPriv);
  r.pulPriv = {PT:0,PB:0,Comune:0}; priv.forEach(m=>{ r.pulPriv[m.piano]=(r.pulPriv[m.piano]||0)+(+m.pulizie||0); });
  r.pulPrivTot = r2(priv.reduce((s,m)=>s+(+m.pulizie||0),0));
  r.pulCash = r2(r.pulInc - r.pulPag);              // effetto sul conto oggi
  r.pulNet = r2(r.pulInc + r.pulPrivTot - r.pulPag); // soldi messi da parte per la signora
  r.canali = CANALI.map(c=>({c, imp:sum(ent,m=>m.canale===c), n:ent.filter(m=>m.canale===c&&m.dataFine).length, notti:ent.filter(m=>m.canale===c).reduce((s,m)=>s+notti(m),0)}));
  r.totEnt = sum(ent);
  r.daInc = ent.reduce((s,m)=>s+residuo(m),0);
  r.caparre = ent.filter(m=>!m.saldato).reduce((s,m)=>s+Math.min(+m.importo||0,+m.caparra||0),0);
  r.notti = ent.filter(m=>m.canale!=='Uso privato').reduce((s,m)=>s+notti(m),0);
  r.lenzPul = ent.reduce((s,m)=>s+(+m.lenzuola||0)+(+m.pulizie||0),0);
  r.perPiano = {};
  ['PT','PB','Comune'].forEach(p=>{ const a=ent.filter(m=>m.piano===p); const paid=a.filter(m=>m.canale!=='Uso privato');
    const n=paid.reduce((s,m)=>s+notti(m),0); const inc=sum(a);
    r.perPiano[p]={inc, notti:n, nottiPriv:a.filter(m=>m.canale==='Uso privato').reduce((s,m)=>s+notti(m),0), soggiorni:paid.length, pn: n? inc/n : 0}; });
  const com = usc.filter(m=>m.piano==='Comune');
  const cats = [...new Set([...S.cats, ...com.map(m=>m.categoria||'VARIE')])];
  r.catCom = cats.map(c=>[c, sum(com,m=>(m.categoria||'VARIE')===c)]);
  r.provv = r2(r.totEnt*(+e.provvPct||0));
  r.totCom = sum(com) + r.provv + r.pulPriv.Comune;
  r.guad = r.totEnt - r.totCom;
  r.spPT = sum(usc,m=>m.piano==='PT') + r.pulPriv.PT; r.spPB = sum(usc,m=>m.piano==='PB') + r.pulPriv.PB;
  r.prPT = sum(prel,m=>m.piano==='PT'); r.prPB = sum(prel,m=>m.piano==='PB');
  const q = +e.quotaPT;
  r.quotaPT = r.guad*q; r.quotaPB = r.guad*(1-q);
  r.utPT = (+e.utiliPT||0) + r.quotaPT - r.spPT - r.prPT;
  r.utPB = (+e.utiliPB||0) + r.quotaPB - r.spPB - r.prPB;
  r.daPag = sum(usc,m=>!m.saldato);
  const an = anticipi(e); r.an = an;
  r.provvMeta = r.provv/2;
  r.provvDaPag = r.provv - an.tot;
  r.cassa = (+e.fondoCassa||0) + (r.totEnt-r.daInc) - (sum(usc)-r.daPag) - an.tot - sum(prel) + r.terzi + r.pulCash;
  r.cassaFin = r.cassa + r.daInc - r.daPag - r.provvDaPag - r.terzi - r.pulNet;
  r.diffAp = (+e.fondoCassa||0) - (+e.utiliPT||0) - (+e.utiliPB||0);
  r.quad = r.utPT + r.utPB + r.daPag + r.provvDaPag - r.daInc + r.diffAp + r.terzi + r.pulNet;
  r.quadOk = Math.abs(r.quad-r.cassa) < 0.01;
  r.warn = M.filter(m=>warnText(m,e));
  return r;
}

/* bilancio completo: a schermo (Cassa) e nell'export Excel */
function bilRows(e,r){
  const R=[];
  R.push({h:'1. Entrate'});
  r.canali.forEach(x=>R.push({l:canL(x.c), v:x.imp, n:x.n?`${x.n} soggiorni, ${x.notti} notti`:'', ind:1}));
  R.push({l:'Totale entrate', v:r.totEnt, strong:1});
  R.push({l:'di cui ancora da incassare (saldi)', v:r.daInc, n:r.caparre?`Caparre già versate su prenotazioni non saldate: ${eur(r.caparre)}`:'', ind:1});
  R.push({l:'Notti affittate (escluso uso privato)', v:r.notti, plain:1});
  R.push({l:'Pulizie e lenzuola pagate dagli ospiti', v:r.lenzPul, n:'Non sono incasso: vanno alla signora delle pulizie', ind:1});
  R.push({h:'2. Uscite comuni'});
  r.catCom.forEach(([c,v])=>R.push({l:cap(c), v, ind:1}));
  R.push({l:`Provvigioni affitti (${r2((+e.provvPct||0)*100)}%)`, v:r.provv, ind:1});
  R.push({l:'Totale uscite comuni', v:r.totCom, strong:1});
  R.push({l:'Guadagno comune (entrate − uscite comuni)', v:r.guad, strong:1});
  R.push({h:'3. Utile per piano', cols:['PT','PB','Totale']});
  R.push({l:'Utile iniziale', c:[+e.utiliPT||0, +e.utiliPB||0]});
  R.push({l:`+ Quota guadagno comune (${Math.round(e.quotaPT*100)}/${Math.round((1-e.quotaPT)*100)})`, c:[r.quotaPT, r.quotaPB]});
  R.push({l:'− Spese del piano', c:[-r.spPT, -r.spPB]});
  R.push({l:'− Prelievi / dividendi', c:[-r.prPT, -r.prPB]});
  R.push({l:'Utile disponibile', c:[r.utPT, r.utPB], strong:1});
  R.push({h:`4. Provvigioni (${r2((+e.provvPct||0)*100)}% delle entrate, metà a testa)`, cols:['Giacomo','Papà','Totale']});
  R.push({l:'Quota maturata', c:[r.provvMeta, r.provvMeta]});
  R.push({l:'− Anticipate durante l\'anno', c:[-r.an.g, -r.an.p]});
  R.push({l:'Da pagare alla chiusura', c:[r.provvMeta-r.an.g, r.provvMeta-r.an.p], strong:1});
  R.push({h:'5. Da saldare'});
  R.push({l:'Saldi che gli ospiti devono ancora pagare', v:r.daInc, ind:1});
  R.push({l:'Spese ancora da pagare', v:r.daPag, ind:1});
  R.push({l:'Provvigioni da pagare alla chiusura', v:r.provvDaPag, ind:1});
  if(r.depDaRest) R.push({l:'Caparre da restituire', v:r.depDaRest, ind:1});
  R.push({l:'Pulizie da pagare alla signora', v:r.pulDaPag, n:`${r.pulInterv} interventi dal ${fmtD(r.pulDal)}`, ind:1});
  R.push({h:'6. Conto'});

  R.push({l:'− Provvigioni anticipate', v:-r.an.tot, ind:1});
  R.push({l:'− Prelievi / dividendi', v:-sum(r.prel), ind:1});
  if(r.antic) R.push({l:'+ Affitti già pagati per i prossimi esercizi', v:r.antic, n:r.fut.filter(m=>incassato(m)).map(m=>m.descrizione||'ospite').join(', '), ind:1});
  if(r.depDaRest) R.push({l:'+ Caparre da restituire (ancora sul conto)', v:r.depDaRest, ind:1});
  if(r.pulInc||r.pulPag){ R.push({l:'+ Pulizie pagate dagli ospiti', v:r.pulInc, n:`soggiorni finiti dopo il ${fmtD(r.pulDal)}`, ind:1}); R.push({l:'− Pulizie pagate alla signora', v:-r.pulPag, ind:1}); }
  R.push({l:'Saldo calcolato', v:r.cassa, strong:1});
  if(e.cassaReale!==null && e.cassaReale!==undefined && e.cassaReale!==''){
    R.push({l:`Saldo reale del conto (${fmtD(e.dataCassaReale)})`, v:+e.cassaReale, ind:1});
    R.push({l:'Differenza (reale − calcolato)', v:+e.cassaReale-r.cassa, ind:1});
  }
  R.push({l:'Saldo dopo aver saldato tutto', v:r.cassaFin, n:r.terzi?'Saldo di partenza del prossimo esercizio, senza anticipi e caparre da restituire':'Saldo di partenza del prossimo esercizio', strong:1});
  R.push({h:'7. Di chi sono i soldi sul conto'});
  R.push({l:'Utile Piano Terra', v:r.utPT, ind:1});
  R.push({l:'Utile Piano Balconi', v:r.utPB, ind:1});
  R.push({l:'+ Spese e provvigioni da pagare', v:r.daPag+r.provvDaPag, ind:1});
  R.push({l:'− Crediti verso ospiti', v:-r.daInc, ind:1});
  R.push({l:'+ Non attribuito a nessun piano', v:r.diffAp, n:'Saldo iniziale − utili iniziali', ind:1});
  if(r.terzi) R.push({l:'+ Soldi non ancora nostri (anticipi e caparre)', v:r.terzi, ind:1});
  if(r.pulNet) R.push({l:'+ Pulizie incassate non ancora girate alla signora', v:r.pulNet, ind:1});
  R.push({l:'Totale (uguale al saldo calcolato)', v:r.quad, strong:1});
  R.push({l:'Controllo', text: r.quadOk?'OK':'Non quadra', ok:r.quadOk});
  return R;
}

let CONN=null; try{ CONN=JSON.parse(localStorage.getItem('chalet-conn')||'null'); }catch(_){}
const numOrNull = v => (v===''||v===null||v===undefined) ? null : +v;
const bool = v => v===true || v==='TRUE' || v==='true' || v===1;
function normMov(m){ return { ...m, id:String(m.id), importo:+m.importo||0, caparra:+m.caparra||0, saldato:bool(m.saldato),
  lenzuola:numOrNull(m.lenzuola), pulizie:numOrNull(m.pulizie), cani:+m.cani||0, persone:+m.persone||0, data:m.data||'', dataFine:m.dataFine||'', note:m.note||'', descrizione:m.descrizione===''?'':String(m.descrizione??''), esercizio:String(m.esercizio) }; }
function normEs(x){ const o={...x, id:String(x.id), chiuso:bool(x.chiuso), cassaReale:numOrNull(x.cassaReale)};
  ['fondoCassa','utiliPT','utiliPB','quotaPT','provvPct','provvPagate'].forEach(k=>o[k]=+x[k]||0);
  ['provvGiacomo','provvPapa'].forEach(k=>o[k]=numOrNull(x[k])); if(!o.pulizieDal) delete o.pulizieDal; else o.pulizieDal=String(o.pulizieDal).slice(0,10); return o; }
function applica(j){
  S.movs=(j.movimenti||[]).map(normMov); S.eser={}; (j.esercizi||[]).forEach(x=>{ const e=normEs(x); S.eser[e.id]=e; });
  if(j.config && Array.isArray(j.config.categorie) && j.config.categorie.length) S.cats=j.config.categorie;
  S.sheetUrl=j.foglio||''; S.got.m=S.got.e=true; S.failed=false; pickCurrent(); render();
}
async function api(azione, extra){
  if(!CONN) throw {message:'app non collegata'};
  let res;
  try{ res = await fetch(CONN.url,{method:'POST', body:JSON.stringify({pin:CONN.pin, azione, ...(extra||{})})}); }
  catch(_){ throw {message:'nessuna connessione'}; }
  let j; try{ j=await res.json(); }catch(_){ throw {message:'risposta non valida dal Foglio'}; }
  if(j.errore) throw {code:j.errore, message: j.errore==='pin' ? 'PIN sbagliato' : j.errore};
  applica(j); return j;
}
const newId = () => 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const store = {
  doc(path){ const [col,id]=path.split('/'); return {
    set: d => col==='config' ? api('salva',{foglio:'config', riga:{id:'categorie', valore:d.categorie}}) : api('salva',{foglio:col, riga:{...d, id}}),
    update: d => { const base = col==='movimenti' ? S.movs.find(m=>m.id===id) : S.eser[id]; return api('salva',{foglio:col, riga:{...(base||{}), ...d, id}}); },
    delete: () => api('elimina',{foglio:col, id}) }; },
  collection(col){ return { add: d => api('salva',{foglio:col, riga:{...d, id:newId()}}) }; }
};

/* sfoglia con il dito: verso sinistra = mese dopo, verso destra = mese prima */
function swipe(el, next, prev){ if(!el) return; let x0=null,y0=null;
  el.addEventListener('touchstart',ev=>{ const t=ev.touches[0]; x0=t.clientX; y0=t.clientY; },{passive:true});
  el.addEventListener('touchend',ev=>{ if(x0===null) return; const t=ev.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.3){ if(dx<0) next(); else prev(); } },{passive:true}); }

function calendar(ents){
  const [y,mo]=S.calM;
  const first=new Date(y,mo,1), startDow=(first.getDay()+6)%7, days=new Date(y,mo+1,0).getDate(), t=today();
  const book = ents.filter(m=>m.data&&m.dataFine);
  const find=(p,ds)=>book.find(m=>(m.piano===p||m.piano==='Comune') && m.data<=ds && ds<m.dataFine);
  let h=['lun','mar','mer','gio','ven','sab','dom'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<startDow;i++) h+='<div class="day blank"></div>';
  for(let d=1; d<=days; d++){
    const ds=iso(new Date(y,mo,d)), dow=(startDow+d-1)%7;
    const bars=['PT','PB'].map(p=>{ const m=find(p,ds); if(!m) return '<span class="bar free"></span>';
      const start = m.data===ds || dow===0 || d===1; const end = addDays(ds,1)===m.dataFine;
      const label = start ? esc((m.descrizione||'').split(/[ (]/)[0]) : '';
      return `<button class="bar ${p}${m.canale==='Uso privato'?' priv':''}${m.data===ds?' start':''}${end?' end':''}" data-id="${esc(m.id)}" title="${esc(PIANO_L[p]+': '+(m.descrizione||'')+' '+fmtD(m.data)+' → '+fmtD(m.dataFine))}">${label}</button>`; }).join('');
    h+=`<div class="day${ds===t?' today':''}"><span class="dn">${d}</span>${bars}</div>`;
  }
  return h;
}

/* ---------- inserimento / modifica ---------- */
function esForDate(ds){ return Object.values(S.eser).find(x=>ds>=x.inizio && ds<=fineEs(x)); }
/* esercizio di una data, anche se non è ancora stato aperto (es. prenotazione dell'anno prossimo) */
function esIdFor(ds){ const f=esForDate(ds); if(f) return f.id; const c=cur(); const md=(c?c.inizio:'2026-03-01').slice(4); const y=+ds.slice(0,4); return esId(ds>=`${y}${md}`?`${y}${md}`:`${y-1}${md}`); }
function openForm(m, tipo, preset){
  const isNew=!m;
  const d = m ? {...m} : Object.assign({ tipo, data:today(), dataFine:'', piano: tipo==='Uscita'?'Comune':'PT', canale: tipo==='Entrata'?'Cash':'',
     categoria: tipo==='Entrata'?'AFFITTO':(tipo==='Prelievo'?'DIVIDENDO':(tipo==='Deposito'?'CAPARRA':'VARIE')), descrizione: tipo==='Prelievo'?'Prelievo dividendo':'', importo:'', caparra:'', saldato:tipo!=='Entrata'&&tipo!=='Deposito', lenzuola:null, pulizie:null, note:'' }, preset||{});
  if(d.tipo==='Entrata' && isNew && !(preset&&preset.data)) d.data='';
  d.cani = +d.cani||0; d.haCani = d.cani>0;
  d.persone = +d.persone||0; d.haLenz = d.persone>0;
  { const b=d.data || (S.calM ? iso(new Date(S.calM[0],S.calM[1],1)) : today()); d.pkM=[+b.slice(0,4), +b.slice(5,7)-1]; }
  if(d.tipo==='Entrata') d.tot = (d.importo===''||d.importo===null||d.importo===undefined) ? '' : totale(d);
  /* pulizie automatiche: 70 € a piano (140 tutta la casa), niente per uso privato. Sui soggiorni già chiusi prima della regola restano quelle salvate */
  const esF = (m && S.eser[m.esercizio]) || cur();
  const pulAuto = () => isNew || !d.dataFine || d.dataFine > (esF ? (esF.pulizieDal||esF.inizio) : '');
  d.privPul = d.canale==='Uso privato' && +d.pulizie>0;
  const autoPul = () => (d.canale==='Uso privato' && !d.privPul) ? 0 : (d.piano==='Comune' ? 140 : 70);
  const sh=$('#sheet');
  let firstDraw=true;
  const draw=()=>{
    const ent=d.tipo==='Entrata', pre=d.tipo==='Prelievo', dep=d.tipo==='Deposito';
    if(dep) d.piano='Comune';
    const pianoOpts = ent ? [['PT','Piano Terra'],['PB','Piano Balconi'],['Comune','Tutta la casa']] : pre ? [['PT','Piano Terra'],['PB','Piano Balconi']] : [['Comune','Comune'],['PT','Piano Terra'],['PB','Piano Balconi']];
    const title = ent?(isNew?'Nuova prenotazione':'Prenotazione'):pre?'Prelievo / dividendo':dep?'Caparra da restituire':(isNew?'Nuova spesa':'Spesa');
    const sc0=sh.scrollTop, sc1=sh.firstElementChild?sh.firstElementChild.scrollTop:0;
    sh.innerHTML = `<div class="panel${firstDraw?' anim':''}" role="dialog" aria-modal="true" aria-labelledby="fTitle">
      <div class="sectionhead"><h2 id="fTitle" style="font-size:1.2rem">${title}</h2><button class="btn small" id="fClose">Chiudi</button></div>
      ${ent && !isNew && residuo(m)>0 ? `<div class="banner num"><b>L'ospite deve ancora ${eur(daOspite(m))}</b>${extra(m)?`: ${eur(residuo(m))} di incasso + ${eur(extra(m))} di pulizie e lenzuola`:''}<br>Totale ${eur(r2(+m.importo+extra(m)))}${+m.caparra?` · caparra versata ${eur(Math.min(+m.importo,+m.caparra))}`:''}<br><button class="btn small primary" id="fPaid" style="margin-top:8px">Segna saldo incassato</button></div>`:''}
      ${dep?'<p class="sub" style="margin:0 0 10px">Soldi arrivati sul conto che dovete ridare (es. caparra di chi ha annullato). Non sono un incasso: quando li restituisci, spunta “Già restituita”.</p>':''}
      <div class="field"${dep?' hidden':''}><span>${pre?'Di quale piano':'Piano'}</span><div class="seg" role="group">${pianoOpts.map(([k,l])=>`<button data-pi="${k}" aria-pressed="${d.piano===k}">${l}</button>`).join('')}</div></div>
      ${ent?`<div class="field"><span>Canale</span><div class="seg" role="group">${CANALI.map(c=>`<button data-c="${c}" aria-pressed="${d.canale===c}">${c==='Uso privato'?'Privato':canL(c)}</button>`).join('')}</div></div>
        <label class="field"><span>Ospite</span><input id="f-desc" value="${esc(d.descrizione)}" placeholder="es. Rossi" autocomplete="off"></label>
        <div class="field"><span>Date del soggiorno</span><div class="rp" id="rp"></div>
          <input id="f-data" type="hidden" value="${esc(d.data)}"><input id="f-fine" type="hidden" value="${esc(d.dataFine)}"></div>
        <div class="grid2 optrow"><label class="toggle"><input id="f-hcani" type="checkbox" ${d.haCani?'checked':''}> Ospiti con cani</label>
          <label class="field" id="f-caniBox" style="margin:0"${d.haCani?'':' hidden'}><span>Quanti cani</span><select id="f-cani">${[1,2,3,4,5].map(n=>`<option value="${n}"${n===(d.cani||1)?' selected':''}>${n}</option>`).join('')}</select></label></div>
        <div class="grid2 optrow" id="f-lenzRow"${d.canale==='Uso privato'?' hidden':''}><label class="toggle"><input id="f-hlenz" type="checkbox" ${d.haLenz?'checked':''}> Aggiunta lenzuola</label>
          <label class="field" id="f-lenzBox" style="margin:0"${d.haLenz?'':' hidden'}><span>Persone (10 € l'una)</span><input id="f-pers" type="number" inputmode="numeric" min="1" step="1" value="${d.persone||''}" placeholder="0"></label></div>
        <div class="grid2"><label class="field"><span>Prezzo totale €</span><input id="f-imp" class="amount" type="number" inputmode="decimal" step="0.01" value="${d.tot===''?'':d.tot}" placeholder="0"></label><span></span></div>
        <p class="info num" id="fInfo"></p>
        <div class="grid2"><label class="field"><span>Caparra già versata €</span><input id="f-cap" type="number" inputmode="decimal" step="0.01" value="${d.caparra===''||d.caparra===null||d.caparra===undefined?'':d.caparra}" placeholder="0"></label>
          <label class="toggle" style="align-self:end;padding-bottom:10px"><input id="f-sal" type="checkbox" ${d.saldato?'checked':''}> Saldato tutto</label></div>
        <label class="toggle" id="f-ppulBox" style="margin-bottom:10px"${d.canale==='Uso privato'?'':' hidden'}><input id="f-ppul" type="checkbox" ${d.privPul?'checked':''}> <span id="f-ppulT">Con pulizie (${d.piano==='Comune'?'140':'70'} €, spesa ${d.piano==='Comune'?'comune':'del piano'})</span></label>
        <p class="info num" id="fSaldo"></p>`
      : `${pre||dep?'':`<label class="field"><span>Categoria</span><select id="f-cat">${[...new Set([...S.cats, d.categoria].filter(Boolean))].map(c=>`<option value="${esc(c)}"${c===d.categoria?' selected':''}>${esc(cap(c))}</option>`).join('')}</select></label>`}
        <label class="field"><span>Importo €</span><input id="f-imp" class="amount" type="number" inputmode="decimal" step="0.01" value="${d.importo===''||d.importo===null?'':d.importo}" placeholder="0,00"></label>
        <div class="grid2"><label class="field"><span>Data</span><input id="f-data" type="date" value="${esc(d.data)}"></label>
          ${pre?'<span></span>':`<label class="toggle" style="align-self:end;padding-bottom:10px"><input id="f-sal" type="checkbox" ${d.saldato?'checked':''}> ${dep?'Già restituita':'Già pagata'}</label>`}</div>
        <label class="field"><span>${dep?'Di chi':'Descrizione'}</span><input id="f-desc" value="${esc(d.descrizione)}" placeholder="${pre?'es. Dividendo a Giacomo':dep?'es. Rossi, prenotazione annullata':'es. Bolletta nov-dic'}" autocomplete="off"></label>`}
      <label class="field"><span>Note</span><textarea id="f-note">${esc(d.note)}</textarea></label>
      <p class="err" id="fErr" hidden></p>
      <div class="actions"><button class="btn primary" id="fSave">Salva</button>${isNew?'<span></span>':'<button class="btn danger" id="fDel">Elimina</button>'}</div>
    </div>`;
    const grab=()=>{ d.descrizione=$('#f-desc').value; d.data=$('#f-data').value; if($('#f-fine')) d.dataFine=$('#f-fine').value;
      if(ent){ d.tot=$('#f-imp').value; d.haCani=$('#f-hcani').checked; d.cani = d.haCani ? (+($('#f-cani')||{}).value||1) : 0;
        d.haLenz = d.canale!=='Uso privato' && $('#f-hlenz').checked; d.persone = d.haLenz ? Math.max(0,Math.round(+$('#f-pers').value||0)) : 0;  if($('#f-ppul')) d.privPul=$('#f-ppul').checked; if(pulAuto()) d.pulizie=autoPul();
        d.importo = d.canale==='Uso privato' ? 0 : (d.tot==='' ? '' : r2(+d.tot - (+d.pulizie||0) - (+d.lenzuola||0))); if(d.canale==='Uso privato') d.tot=0; }
      else d.importo=$('#f-imp').value;
      if($('#f-sal')) d.saldato=$('#f-sal').checked; d.note=$('#f-note').value;
      if($('#f-cap')) d.caparra=$('#f-cap').value;
      if($('#f-cat')) d.categoria=$('#f-cat').value; };
    const info=()=>{ const el=$('#fInfo'); if(!el) return; grab(); const n=notti(d);
      const fs=$('#fSaldo'); if(fs){ const tot=+d.tot||0, cap=+d.caparra||0;
        fs.innerHTML = d.saldato ? (tot?`Incassati tutti i ${eur(tot)}.`:'') : (tot ? `Caparra ${eur(Math.min(cap,tot))} · <b style="color:var(--wood)">l'ospite deve ancora ${eur(Math.max(0,tot-cap))}</b>` : ''); }
      const pn=n && d.tot!==''? (+d.tot)/n : 0;
      const over = S.movs.filter(o=>o.tipo==='Entrata' && o.id!==d.id && o.data && o.dataFine && d.data && d.dataFine &&
        (o.piano===d.piano || o.piano==='Comune' || d.piano==='Comune') && o.data<d.dataFine && d.data<o.dataFine);
      const ex=extra(d);
      el.innerHTML = `${n?`${n} ${n===1?'notte':'notti'}`:'Scegli le date per vedere le notti.'}${d.tot!==''&&+d.tot?`<br>di cui pulizie ${eur(+d.pulizie||0)}${+d.lenzuola?` e lenzuola ${eur(+d.lenzuola)}`:''} (alla signora) · incasso ${eur(+d.tot-ex)}${d.haLenz&&d.persone?` (compresi ${eur(d.persone*10)} di lenzuola per ${d.persone} ${d.persone===1?'persona':'persone'})`:''}`:''}${over.length?`<br><span class="err">Si sovrappone a ${over.map(o=>esc(o.descrizione||'un\'altra prenotazione')+' ('+fmtD(o.data)+')').join(', ')}</span>`:''}`; };
    /* nella prenotazione piano e canale si aggiornano sul posto, senza ridisegnare la scheda (che altrimenti torna in cima) */
    let refresh=null;
    sh.querySelectorAll('[data-pi]').forEach(b=>b.onclick=()=>{ grab(); d.piano=b.dataset.pi; if(!refresh) return draw(); refresh(); });
    sh.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ grab(); d.canale=b.dataset.c; if(d.canale==='Uso privato' && (d.tot===''||d.tot===undefined)){ d.tot=0; $('#f-imp').value=0; } refresh(); });
    if(ent){
      const rp=()=>{ const el=$('#rp'); if(!el) return; const [y,mo]=d.pkM;
        const first=new Date(y,mo,1), sd=(first.getDay()+6)%7, days=new Date(y,mo+1,0).getDate(), t=today();
        const oth=S.movs.filter(o=>o.tipo==='Entrata' && o.id!==d.id && o.data && o.dataFine && (o.piano===d.piano || o.piano==='Comune' || d.piano==='Comune'));
        const busy=ds=>oth.some(o=>o.data<=ds && ds<o.dataFine);
        const lab=s=>s?`${+s.slice(8,10)} ${MESI[+s.slice(5,7)-1]}`:'—';
        let g=['lun','mar','mer','gio','ven','sab','dom'].map(x=>`<div class="dow">${x}</div>`).join('');
        for(let i=0;i<sd;i++) g+='<span></span>';
        for(let k=1;k<=days;k++){ const ds=iso(new Date(y,mo,k));
          const sel = ds===d.data || ds===d.dataFine, inR = d.data && d.dataFine && ds>d.data && ds<d.dataFine;
          g+=`<button type="button" data-ds="${ds}" class="${busy(ds)?'busy ':''}${sel?'sel ':inR?'in ':''}${ds===t?'td':''}" aria-pressed="${sel}">${k}</button>`; }
        for(let i=sd+days;i<42;i++) g+='<span></span>';
        const step = !d.data || d.dataFine ? 'arr' : 'par';
        el.innerHTML=`<div class="rpsel"><div class="${step==='arr'?'on':''}">Arrivo<b>${lab(d.data)}</b></div><div class="${step==='par'?'on':''}">Partenza<b>${lab(d.dataFine)}</b></div></div>
          <div class="rphead"><button type="button" class="btn small" id="rpPrev" aria-label="Mese precedente">‹</button><b>${MESI_L[mo]} ${y}</b><button type="button" class="btn small" id="rpNext" aria-label="Mese successivo">›</button></div>
          <div class="rpg">${g}</div><p class="rpnote">${step==='arr'?'Tocca il giorno di arrivo':'Ora tocca il giorno di partenza'} · a righe i giorni già occupati</p>`;
        const mv=dlt=>{ let m2=mo+dlt, y2=y; if(m2<0){m2=11;y2--;} if(m2>11){m2=0;y2++;} d.pkM=[y2,m2]; rp(); };
        $('#rpPrev').onclick=()=>mv(-1); $('#rpNext').onclick=()=>mv(1);
        el.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{ const ds=b.dataset.ds;
          if(!d.data || d.dataFine || ds<=d.data){ d.data=ds; d.dataFine=''; } else d.dataFine=ds;
          $('#f-data').value=d.data; $('#f-fine').value=d.dataFine; rp(); info(); });
      };
      refresh=()=>{ sh.querySelectorAll('[data-pi]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.pi===d.piano));
        sh.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.c===d.canale));
        $('#f-ppulBox').hidden = d.canale!=='Uso privato'; $('#f-lenzRow').hidden = d.canale==='Uso privato'; if(d.canale!=='Uso privato') $('#f-ppul').checked=false;
        $('#f-ppulT').textContent = `Con pulizie (${d.piano==='Comune'?'140':'70'} €, spesa ${d.piano==='Comune'?'comune':'del piano'})`;
        rp(); info(); };
      rp(); swipe($('#rp'), ()=>$('#rpNext').click(), ()=>$('#rpPrev').click());
      $('#f-hlenz').onchange=()=>{ $('#f-lenzBox').hidden=!$('#f-hlenz').checked; info(); if($('#f-hlenz').checked && !$('#f-pers').value) $('#f-pers').focus({preventScroll:true}); };
      $('#f-pers').oninput=info;
      $('#f-hcani').onchange=()=>{ $('#f-caniBox').hidden=!$('#f-hcani').checked; grab(); };
      $('#f-imp').oninput=info; $('#f-cap').oninput=info; $('#f-sal').onchange=info; if($('#f-ppul')) $('#f-ppul').onchange=info;
      info();
    }
    sh.scrollTop=sc0; if(sh.firstElementChild) sh.firstElementChild.scrollTop=sc1; firstDraw=false;
    $('#fClose').onclick=close;
    const fp=$('#fPaid'); if(fp) fp.onclick=async()=>{ fp.disabled=true; try{ await S.db.doc('movimenti/'+m.id).update({saldato:true, aggiornato:new Date().toISOString()}); close(); toast('Saldo segnato come incassato'); }catch(x){ fp.disabled=false; toast('Non salvato: '+errMsg(x)); } };
    $('#fSave').onclick=async()=>{
      grab();
      const err=$('#fErr'); const fail=t=>{ err.textContent=t; err.hidden=false; };
      if(!d.data) return fail('Manca la data.');
      if(d.importo==='' || isNaN(+d.importo)) return fail(ent?'Scrivi il prezzo totale (0 per uso privato).':'Scrivi l\'importo.');
      if(ent && +d.importo < 0) return fail('Il totale è più basso delle pulizie ('+eur(extra(d))+').');
      if(ent && +d.caparra > +d.tot) return fail('La caparra è più alta del totale.');
      if(ent && !d.dataFine) return fail('Manca la data di partenza.');
      if(ent && d.haLenz && !d.persone) return fail('Scrivi per quante persone sono le lenzuola.');
      if(ent && d.dataFine<=d.data) return fail('La partenza deve essere dopo l\'arrivo.');
      const esN = (isNew || d.data!==m.data) ? (dep ? (esForDate(d.data)||cur()).id : esIdFor(d.data)) : d.esercizio;
      const out={ data:d.data, dataFine:ent?d.dataFine:'', tipo:d.tipo, piano:d.piano, canale:ent?d.canale:'',
        categoria:ent?'AFFITTO':(pre?'DIVIDENDO':(dep?'CAPARRA':(d.categoria||'VARIE'))), descrizione:d.descrizione.trim(), importo:r2(+d.importo), saldato:pre?true:!!d.saldato,
        note:d.note.trim(), esercizio: esN };
      if(ent){ out.caparra = d.caparra===''||d.caparra===null||d.caparra===undefined ? 0 : r2(+d.caparra); 
        out.lenzuola = d.lenzuola===''||d.lenzuola===null||d.lenzuola===undefined?null:+d.lenzuola; out.pulizie = d.pulizie===''||d.pulizie===null||d.pulizie===undefined?null:+d.pulizie;
        out.cani = d.haCani ? (+d.cani||1) : 0; out.persone = d.haLenz ? d.persone : 0;
        if(+d.tot>0 && out.caparra>=+d.tot) out.saldato=true; }
      const b=$('#fSave'); b.disabled=true; b.textContent='Salvo…';
      try{ await saveMov(isNew?null:m.id,out); close(); toast(esN!==S.cur?'Salvato nell\'esercizio '+esN.replace('-','/'):(isNew?'Salvato':'Modifiche salvate')); }
      catch(x){ b.disabled=false; b.textContent='Salva'; fail('Non salvato: '+errMsg(x)); }
    };
    const del=$('#fDel');
    if(del) del.onclick=async()=>{
      if(!del.dataset.sure){ del.dataset.sure='1'; del.textContent='Tocca ancora per eliminare'; return; }
      try{ await S.db.doc('movimenti/'+m.id).delete(); close(); toast('Eliminato'); }catch(x){ toast('Non eliminato: '+errMsg(x)); }
    };
  };
  const close=()=>{ sh.hidden=true; sh.innerHTML=''; document.body.classList.remove('noscroll'); document.removeEventListener('keydown',onKey); };
  const onKey=ev=>{ if(ev.key==='Escape') close(); };
  sh.onclick=ev=>{ if(ev.target===sh) close(); };
  document.addEventListener('keydown',onKey);
  draw(); sh.hidden=false; document.body.classList.add('noscroll');
  setTimeout(()=>{ const f = d.tipo==='Entrata' ? $('#f-desc') : $('#f-imp'); if(f && isNew) f.focus(); },60);
}

/* ---------- export Excel ---------- */
function xDate(s){ if(!s) return ''; return new Date(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)); }
/* Excel con la stessa struttura del file "BILANCIO OSSANA": Entrate, Uscite Comuni, Uscite PT, Uscite PB, Bilancio (+ Movimenti) */
function buildWorkbook(e,r){
  const EURF='#,##0.00 "€"', DATEF='dd/mm/yyyy', PCT='0%';
  const mk=()=>({});
  const put=(ws,addr,v,z)=>{ let c;
    if(v && typeof v==='object' && 'f' in v) c={t:'n',f:v.f};
    else if(v instanceof Date) c={t:'d',v};
    else if(typeof v==='number') c={t:'n',v};
    else if(v===''||v===null||v===undefined) return;
    else c={t:'s',v:String(v)};
    if(z) c.z=z; ws[addr]=c; };
  const fin=(ws,ref,cols,merges)=>{ ws['!ref']=ref; ws['!cols']=cols.map(w=>({wch:w})); if(merges) ws['!merges']=merges.map(m=>XLSX.utils.decode_range(m)); return ws; };
  const yr=`${fmtD(e.inizio)} - ${fmtD(fineEs(e))}`;
  const pianoX = p => p==='Comune' ? 'PT+PB' : p;
  const sinoX = b => b ? 'Sì' : 'No';
  const wb=XLSX.utils.book_new();

  /* ENTRATE */
  const E=mk(); const ent=r.ent.slice().sort(byDate);
  put(E,'B1',`ENTRATE AFFITTI ${yr}`);
  put(E,'B4','PERIODO'); put(E,'B5','DA'); put(E,'C5','A'); put(E,'D4','NOME'); put(E,'E4','PIANO'); put(E,'F4','PIATTAFORMA');
  put(E,'G4','INCASSO'); put(E,'H4','lenzuola'); put(E,'I4','pulizie'); put(E,'J4','CAPARRA'); put(E,'K4','DA SALDARE'); put(E,'L4','NOTE');
  ent.forEach((m,i)=>{ const row=6+i;
    put(E,'B'+row,xDate(m.data),DATEF); put(E,'C'+row,xDate(m.dataFine),DATEF); put(E,'D'+row,m.descrizione||''); put(E,'E'+row,pianoX(m.piano));
    put(E,'F'+row,canL(m.canale)); put(E,'G'+row,+m.importo||0,EURF); if(m.lenzuola!=null&&m.lenzuola!=='') put(E,'H'+row,+m.lenzuola,EURF);
    if(m.pulizie!=null&&m.pulizie!=='') put(E,'I'+row,+m.pulizie,EURF);
    put(E,'J'+row, m.saldato ? +m.importo||0 : Math.min(+m.importo||0,+m.caparra||0), EURF);
    put(E,'K'+row,{f:`G${row}-J${row}`},EURF); put(E,'L'+row,m.note||''); });
  const eL=Math.max(6,5+ent.length), eR=`6:${eL}`.split(':');
  const G=`G${eR[0]}:G${eR[1]}`, F=`F${eR[0]}:F${eR[1]}`, K=`K${eR[0]}:K${eR[1]}`;
  put(E,'N4','TOTALE INCASSI'); put(E,'O4',{f:`SUM(${G})`},EURF);
  put(E,'N5','di cui da saldare'); put(E,'O5',{f:`SUM(${K})`},EURF);
  put(E,'N6','già incassati'); put(E,'O6',{f:'O4-O5'},EURF);
  put(E,'N8','SUB TOTALI');
  CANALI.forEach((c,i)=>{ put(E,'N'+(9+i),canL(c)); put(E,'O'+(9+i),{f:`SUMIF(${F},"${canL(c)}",${G})`},EURF); });
  XLSX.utils.book_append_sheet(wb,fin(E,`A1:O${eL}`,[3,12,12,24,8,13,12,10,10,11,12,40,3,18,13],['B1:G3','B4:C4']),'Entrate');

  /* USCITE COMUNI */
  const C=mk(); const com=r.usc.filter(m=>m.piano==='Comune').sort(byDate);
  put(C,'B1',`USCITE COSTI ${yr}`);
  put(C,'B4','PERIODO'); put(C,'C4','NOTE'); put(C,'D4','CATEGORIA'); put(C,'E4','COSTO'); put(C,'F4','PAGATO');
  put(C,'B6',xDate(e.inizio),DATEF); put(C,'C6','Provvigioni su affitti (si aggiorna)'); put(C,'D6',`PROVVIGIONI AFFITTI (${r2((+e.provvPct||0)*100)}%)`);
  put(C,'E6',{f:`ROUND(Entrate!O4*Bilancio!C4,2)`},EURF); put(C,'F6','alla chiusura');
  com.forEach((m,i)=>{ const row=7+i;
    put(C,'B'+row,xDate(m.data),DATEF); put(C,'C'+row,m.descrizione||''); put(C,'D'+row,m.categoria||'VARIE'); put(C,'E'+row,+m.importo||0,EURF); put(C,'F'+row,sinoX(m.saldato)); });
  const cL=6+com.length, CE=`E6:E${cL}`, CD=`D6:D${cL}`;
  put(C,'H2',`FONDO CASSA AL ${fmtD(e.dataFondoCassa)}`); put(C,'I2',+e.fondoCassa||0,EURF);
  put(C,'H4','TOTALE COSTI COMUNI'); put(C,'I4',{f:`SUM(${CE})`},EURF);
  const catsC=[...new Set([...S.cats, ...com.map(m=>m.categoria||'VARIE')])];
  catsC.forEach((c,i)=>{ put(C,'H'+(6+i),c); put(C,'I'+(6+i),{f:`SUMIF(${CD},"${c}",${CE})`},EURF); });
  put(C,'H'+(6+catsC.length),`PROVVIGIONI AFFITTI (${r2((+e.provvPct||0)*100)}%)`); put(C,'I'+(6+catsC.length),{f:'E6'},EURF);
  XLSX.utils.book_append_sheet(wb,fin(C,`A1:I${Math.max(cL,7+catsC.length)}`,[3,12,40,26,12,13,3,30,13],['B1:E3']),'Uscite Comuni');

  /* USCITE PT / PB */
  const piano=(p,nome,init)=>{
    const W=mk(); const L=r.M.filter(m=>(m.tipo==='Uscita'||m.tipo==='Prelievo') && m.piano===p).sort(byDate);
    put(W,'B1',`USCITE ${p} ${yr}`);
    put(W,'B4','PERIODO'); put(W,'C4','NOTE'); put(W,'D4','COSTO'); put(W,'E4','CATEGORIA'); put(W,'F4','PAGATO');
    L.forEach((m,i)=>{ const row=6+i;
      put(W,'B'+row,xDate(m.data),DATEF); put(W,'C'+row,m.descrizione||''); put(W,'D'+row,+m.importo||0,EURF);
      put(W,'E'+row,m.tipo==='Prelievo'?'PRELIEVO DIVIDENDO':(m.categoria||'VARIE')); put(W,'F'+row,sinoX(m.saldato)); });
    const l=Math.max(6,5+L.length), D=`D6:D${l}`, Ec=`E6:E${l}`;
    put(W,'H2','UTILI INIZIALI'); put(W,'I2',init,EURF);
    put(W,'H3',`TOTALE COSTI ${p}`); put(W,'I3',{f:`SUMIF(${Ec},"<>PRELIEVO DIVIDENDO",${D})`},EURF);
    put(W,'H4','PRELIEVI / DIVIDENDI'); put(W,'I4',{f:`SUMIF(${Ec},"PRELIEVO DIVIDENDO",${D})`},EURF);
    put(W,'H5','UTILE DISPONIBILE'); put(W,'I5',{f:'I2-I3-I4'},EURF);
    XLSX.utils.book_append_sheet(wb,fin(W,`A1:I${l}`,[3,12,40,12,22,9,3,24,13],['B1:D3']),'Uscite '+p);
  };
  piano('PT','Piano Terra',+e.utiliPT||0); piano('PB','Piano Balconi',+e.utiliPB||0);

  /* BILANCIO */
  const B=mk(); const an=anticipi(e);
  put(B,'B1',`BILANCIO ${yr}`);
  put(B,'B3','Quota guadagno al PT'); put(B,'C3',+e.quotaPT,PCT);
  put(B,'B4','Provvigioni affitti'); put(B,'C4',+e.provvPct||0,PCT);
  put(B,'B8','TOTALE ENTRATE'); put(B,'C8','TOTALE USCITE COMUNI'); put(B,'D8','GUADAGNO COMUNE');
  put(B,'B9',{f:'Entrate!O4'},EURF); put(B,'C9',{f:"'Uscite Comuni'!I4"},EURF); put(B,'D9',{f:'B9-C9'},EURF);
  put(B,'B11','GUADAGNO PER PIANO');
  put(B,'B12','Piano Terra'); put(B,'C12',{f:'D9*C3'},EURF);
  put(B,'B13','Piano Balconi'); put(B,'C13',{f:'D9*(1-C3)'},EURF);
  put(B,'B15','UTILI');
  put(B,'B16','PIANO'); put(B,'C16','UTILE DISPONIBILE'); put(B,'D16','NUOVO UTILE'); put(B,'E16','TOT');
  put(B,'B17','Piano Terra'); put(B,'C17',{f:"'Uscite PT'!I5"},EURF); put(B,'D17',{f:'C12'},EURF); put(B,'E17',{f:'C17+D17'},EURF);
  put(B,'B18','Piano Balconi'); put(B,'C18',{f:"'Uscite PB'!I5"},EURF); put(B,'D18',{f:'C13'},EURF); put(B,'E18',{f:'C18+D18'},EURF);
  put(B,'B19','Totale'); put(B,'E19',{f:'E17+E18'},EURF);
  put(B,'B21','PROVVIGIONI'); put(B,'C21','MATURATE'); put(B,'D21','ANTICIPATE'); put(B,'E21','ALLA CHIUSURA');
  put(B,'B22','Giacomo'); put(B,'C22',{f:"'Uscite Comuni'!E6/2"},EURF); put(B,'D22',an.g,EURF); put(B,'E22',{f:'C22-D22'},EURF);
  put(B,'B23','Papà'); put(B,'C23',{f:"'Uscite Comuni'!E6/2"},EURF); put(B,'D23',an.p,EURF); put(B,'E23',{f:'C23-D23'},EURF);
  put(B,'B25','CONTO');
  const pag = sh => `SUMIF('${sh}'!F6:F1000,"Sì",'${sh}'!${sh==='Uscite Comuni'?'E':'D'}6:${sh==='Uscite Comuni'?'E':'D'}1000)`;
  put(B,'B26',`Saldo iniziale (${fmtD(e.dataFondoCassa)})`); put(B,'C26',{f:"'Uscite Comuni'!I2"},EURF);
  put(B,'B27','+ Affitti incassati (caparre comprese)'); put(B,'C27',{f:'Entrate!O6'},EURF);
  put(B,'B28','− Spese e prelievi pagati'); put(B,'C28',{f:`-(${pag('Uscite Comuni')}+${pag('Uscite PT')}+${pag('Uscite PB')})`},EURF);
  put(B,'B29','− Provvigioni anticipate'); put(B,'C29',{f:'-(D22+D23)'},EURF);
  put(B,'B30','+ Anticipi, caparre da restituire, pulizie non ancora girate'); put(B,'C30',r2(r.terzi+r.pulNet),EURF);
  put(B,'B31','SALDO CALCOLATO'); put(B,'C31',{f:'SUM(C26:C30)'},EURF);
  put(B,'B32','Saldo reale del conto'+(e.dataCassaReale?` (${fmtD(e.dataCassaReale)})`:'')); if(e.cassaReale!==null&&e.cassaReale!==undefined&&e.cassaReale!=='') put(B,'C32',+e.cassaReale,EURF);
  put(B,'B33','Differenza (reale − calcolato)'); put(B,'C33',{f:'IF(C32="","",C32-C31)'},EURF);
  put(B,'B35',`File esportato dall'app il ${fmtD(today())}. I dati si modificano nell'app: questo file è una copia.`);
  XLSX.utils.book_append_sheet(wb,fin(B,'A1:E35',[3,40,20,20,16],['B1:E1']),'Bilancio');

  /* MOVIMENTI (registro completo) */
  const head=['Data','Data fine','Tipo','Piano','Canale','Categoria','Descrizione / ospite','Importo €','Incassato / pagato','Caparra €','Da saldare €','Notti','€ a notte','Lenzuola €','Pulizie €','Note'];
  const rows=r.M.slice().sort(byDate).map(m=>[xDate(m.data), xDate(m.dataFine), m.tipo, pianoX(m.piano), canL(m.canale)||'', m.categoria||'', m.descrizione||'', +m.importo||0,
    sinoX(m.saldato), m.tipo==='Entrata'&&+m.caparra?+m.caparra:'', m.tipo==='Entrata'&&residuo(m)?residuo(m):'', notti(m)||'', perNotte(m)?r2(perNotte(m)):'', m.lenzuola??'', m.pulizie??'', m.note||'']);
  const wm=XLSX.utils.aoa_to_sheet([head,...rows],{cellDates:true,dateNF:DATEF}); wm['!cols']=[12,12,9,7,10,22,34,11,10,10,11,6,9,10,10,40].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,wm,'Movimenti');
  return wb;
}
async function exportXlsx(){
  if(!window.XLSX){ toast('Libreria Excel non caricata, riprova'); return; }
  const e=cur(), r=calc(e);
  const out=XLSX.write(buildWorkbook(e,r),{bookType:'xlsx',type:'array',cellDates:true});
  const name=`BILANCIO OSSANA ${e.id.slice(0,4)}-${+e.id.slice(0,4)+1}.xlsx`;
  const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); toast('File Excel scaricato');
}
